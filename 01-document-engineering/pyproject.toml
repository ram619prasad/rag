[project]
name = "01-document-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.2",
    "docling>=2.145.0",
    "docx2txt>=0.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-pymupdf4llm==1.28.0",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "pymupdf>=1.28,<1.29",
    "python-docx>=1.2.0",
    "unstructured>=0.27.36",
]

[project.scripts]
01-document-engineering = "01_document_engineering:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
